services:
  app:
    build: .
    image: auftrag-ai:latest
    container_name: auftrag-ai
    restart: unless-stopped
    ports:
      # Host-Port konfigurierbar: APP_PORT in .env setzen (Standard 3000).
      # Container lauscht intern immer auf 3000.
      - "${APP_PORT:-3000}:3000"
    environment:
      # Persisted, writable data (user accounts + crawled tenders).
      AUFTRAG_DATA_DIR: /data
      # IMPORTANT: set a strong secret in production (e.g. `openssl rand -hex 32`).
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      # Optional: enables real LLM summaries instead of the offline heuristic.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Token to protect the crawl endpoint (POST /api/admin/crawl). Set this to
      # enable scheduled crawling in the container.
      CRAWL_TOKEN: ${CRAWL_TOKEN:-}
      # Optional cosinex-based portal feeds — set the RSS/Atom URL to activate.
      DTVP_FEED_URL: ${DTVP_FEED_URL:-}
      VMP_FEED_URL: ${VMP_FEED_URL:-}
      EVERGABE_FEED_URL: ${EVERGABE_FEED_URL:-}
      # Optional endpoint overrides (defaults point at the official APIs).
      TED_API_URL: ${TED_API_URL:-}
      DOEV_API_URL: ${DOEV_API_URL:-}
    volumes:
      - auftrag-data:/data

volumes:
  auftrag-data:
