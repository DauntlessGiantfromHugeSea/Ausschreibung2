services:
  app:
    build: .
    image: fluessigboden-ai:latest
    container_name: fluessigboden-ai
    restart: unless-stopped
    ports:
      # Host-Port konfigurierbar: APP_PORT in .env setzen (Standard 3000).
      # Container lauscht intern immer auf 3000.
      - "${APP_PORT:-3000}:3000"
    environment:
      # Persisted, writable data (user accounts + crawled tenders).
      AUFTRAG_DATA_DIR: /data
      # IMPORTANT: set a strong secret in production (e.g. `openssl rand -hex 32`).
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      # Admin-Bootstrap: legt beim Start automatisch dieses Admin-Konto an,
      # falls es noch nicht existiert. Passwort in .env setzen!
      ADMIN_EMAIL: ${ADMIN_EMAIL:-d.model@fb-eng.de}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: enables real LLM summaries instead of the offline heuristic.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Token to protect the crawl endpoint (POST /api/admin/crawl). Set this to
      # enable scheduled crawling in the container.
      CRAWL_TOKEN: ${CRAWL_TOKEN:-}
      # cosinex HTML scraper (defaults to vergabeportal-bw when enabled).
      COSINEX_ENABLE: ${COSINEX_ENABLE:-}
      COSINEX_BASE_URL: ${COSINEX_BASE_URL:-}
      COSINEX_LISTING_PATHS: ${COSINEX_LISTING_PATHS:-}
      # Browser-protected portals — provide an RSS feed to activate (see README).
      DTVP_FEED_URL: ${DTVP_FEED_URL:-}
      EVERGABE_FEED_URL: ${EVERGABE_FEED_URL:-}
      # Optional endpoint overrides / tuning (defaults point at the official APIs).
      TED_API_URL: ${TED_API_URL:-}
      TED_MAX_PAGES: ${TED_MAX_PAGES:-}
      TED_FILTER_FBE: ${TED_FILTER_FBE:-}
      DOEV_API_URL: ${DOEV_API_URL:-}
      BUND_RSS_URL: ${BUND_RSS_URL:-}
    volumes:
      - fluessigboden-data:/data

volumes:
  fluessigboden-data:
